name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test
      - run: CGO_ENABLED=0 make build
      - run: gh release create "$GITHUB_REF_NAME" bin/soapstone --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
