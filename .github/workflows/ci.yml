name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Higijena repoa
        run: |
          git ls-files bin .env
          test -z "$(git ls-files bin .env)"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test
  smoke:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build
      - run: |
          ./bin/soapstone > app.log 2>&1 &
          sleep 2
      - run: ./scripts/smoke.sh
      - run: jq -r .status app.log | grep -v null | sort | uniq -c | sort -rn
